<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
<main>
<section class="right">
    <h1>Signin</h1>
<form>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password" maxlength="8" minlength="4">
    <button>Signin</button>
</form>
<p>or signin with</p>
<article>
<i class="fa-brands fa-facebook"></i>
<i class="fa-brands fa-google-plus"></i>
<i class="fa-brands fa-linkedin-in"></i>
</article>
</section>
<section class="left">
    <h1>Welcome Back</h1>
    <p>Welcome back! We are so happy to have you here. It's great to see you again. We hope you had a safe and enjoyable time away</p>
<button>No account yet? Signup.</button>
</section>
</main>
</body>
</html>
